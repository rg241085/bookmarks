<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>My Bookmarks</title>
    <meta name="description" content="Apni pasandida websites ek jagah — har device par sync.">
    <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js" defer></script>
</head>

<body>
    <!-- Loading -->
    <div id="splash" class="splash"><div class="spinner"></div></div>

    <!-- ===== Login ===== -->
    <section id="loginView" class="login" hidden>
        <div class="login-card">
            <img src="icon-192.png" alt="" class="login-logo">
            <h1>My Bookmarks</h1>
            <p>Apni pasandida websites ek jagah.<br>Mobile aur computer — har jagah sync.</p>
            <button id="loginBtn" class="btn btn-google">
                <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
                Google se Login karein
            </button>
        </div>
    </section>

    <!-- ===== App ===== -->
    <div id="appView" hidden>
        <header class="topbar" id="topbar">
            <div class="brand">
                <img src="icon-192.png" alt="">
                <span>Bookmarks</span>
            </div>

            <label class="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input id="search" type="search" placeholder="Search karein..." autocomplete="off" aria-label="Search">
                <kbd class="hide-mobile">/</kbd>
            </label>

            <div class="top-actions">
                <button id="addBtnTop" class="btn btn-primary hide-mobile" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                    Add Website
                </button>
                <button id="userBtn" class="avatar-btn" type="button" aria-label="Account"></button>
                <div id="userMenu" class="menu" hidden>
                    <div class="menu-head">
                        <b id="userName"></b>
                        <small id="userEmail"></small>
                    </div>
                    <button id="installBtn" class="menu-item" type="button" hidden>📲 App install karein</button>
                    <button id="logoutBtn" class="menu-item danger" type="button">↪ Logout</button>
                </div>
            </div>
        </header>

        <main class="main">
            <section class="hero">
                <div>
                    <h1 id="greeting">Namaste 👋</h1>
                    <p id="countText">&nbsp;</p>
                </div>
                <button id="arrangeBtn" class="btn btn-soft" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4 3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4"/></svg>
                    <span>Arrange</span>
                </button>
            </section>

            <div id="grid" class="grid"></div>

            <div id="empty" class="empty" hidden>
                <div class="empty-art" id="emptyArt">🔖</div>
                <h3 id="emptyTitle">Abhi koi website nahi hai</h3>
                <p id="emptyText">Apni pehli pasandida website jodein</p>
                <button id="emptyAddBtn" class="btn btn-primary" type="button">+ Website jodein</button>
            </div>
        </main>

        <!-- Arrange mode bar -->
        <div id="arrangeBar" class="arrange-bar" hidden>
            <span>✋ Drag karke order badlein • Tap = Edit</span>
            <div>
                <button id="arrangeCancel" class="btn btn-ghost" type="button">Cancel</button>
                <button id="arrangeDone" class="btn btn-primary" type="button">Done</button>
            </div>
        </div>

        <button id="fab" class="fab" type="button" aria-label="Website jodein">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
    </div>

    <!-- ===== Add / Edit sheet ===== -->
    <div id="sheet" class="sheet-backdrop" hidden>
        <form id="form" class="sheet" novalidate autocomplete="off">
            <div class="sheet-handle"></div>
            <div class="sheet-head">
                <h2 id="formTitle">Nayi website jodein</h2>
                <button type="button" class="icon-btn" id="closeSheet" aria-label="Band karein">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
                </button>
            </div>

            <div class="preview-row">
                <div id="formIcon"></div>
                <div>
                    <b id="previewName">Website ka naam</b>
                    <small id="previewDomain">website.com</small>
                </div>
            </div>

            <label class="field">
                <span>Website address</span>
                <input id="urlInput" type="text" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="jaise: google.com">
            </label>
            <label class="field">
                <span>Naam</span>
                <input id="nameInput" type="text" maxlength="40" placeholder="Apne aap bhar jayega">
            </label>
            <p id="formError" class="form-error" hidden></p>

            <div class="sheet-actions">
                <button type="button" id="deleteBtn" class="btn btn-danger-soft" hidden>Delete</button>
                <span class="spacer"></span>
                <button type="button" id="cancelBtn" class="btn btn-ghost">Cancel</button>
                <button type="submit" id="saveBtn" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
</body>

</html>
